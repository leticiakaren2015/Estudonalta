<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box centralizado</title>
    <style>
    
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    body {
        background-color: rgba(255, 182, 193, 0.335);
        min-height: 100vh;
        padding: 40px;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    main {
        background-color: blueviolet;
        height: 90vh;
        width: 90vw;

        display: flex;
        flex-flow: row nowrap;
        justify-content: center;
        align-items: center;
    }

    section {
        background-color: rgb(54, 11, 95);
        height: 400px;
        width: 400px;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    h1 {
        color: white;
    }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
</body>
</html>
