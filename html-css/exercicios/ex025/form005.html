<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário</title>
</head>
<body>
    <h1>
        Exemplo de Formulário
    </h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexfem" value="F" checked> 
            <label for="isexfem">Feminino</label> <br>
            <input type="radio" name="sexo" id="isexmas" value="M">
            <label for="isexmas">Masculino</label>
        </fieldset>
        <fieldset>
            <legend>Esporte favorito</legend>
            <input type="checkbox" name="espbas" id="iespbas"> 
            <label for="iespbas">Basquete</label> <br>
            <input type="checkbox" name="espfut" id="iespfut"> 
            <label for="iespfut">Futebol</label> <br>
            <input type="checkbox" name="espnat" id="iespnat"> 
            <label for="iespnat">Natação</label> <br>
            <input type="checkbox" name="espbmx" id="iespbmx" checked> 
            <label for="iespbmx">BMX</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
